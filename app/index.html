<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tracery</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230c7a70%22/%3E%20%20%3Cg%20transform%3D%22translate%2810%2C%2010%29%20scale%281.8333%29%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cg%20transform%3D%22translate%2812%2012%29%20scale%28.885%29%20translate%28-12%20-10.2%29%22%20stroke-width%3D%221.92%22%3E%3Cpolygon%20points%3D%2212%202%2021%207%2021%2017%2012%2022%203%2017%203%207%22%20/%3E%3Cpath%20d%3D%22M12%2022V12%22%20/%3E%3Cpath%20d%3D%22M12%2012L21%207%22%20/%3E%3Cpath%20d%3D%22M12%2012L3%207%22%20/%3E%3Cpath%20d%3D%22M3%207A9%209%200%200%201%2021%207%22%20/%3E%3Cpath%20d%3D%22M21%207A9%209%200%200%201%2012%2022%22%20/%3E%3Cpath%20d%3D%22M12%2022A9%209%200%200%201%203%207%22%20/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f4f6f8; --surface-3:#eaeef2; --line:#d3dae1; --line-strong:#b9c3cd;
  --ink:#16202b; --ink-2:#394656; --muted:#627080; --faint:#8a96a3;
  --accent:#0c7a70; --accent-hover:#096a61; --accent-ink:#ffffff; --accent-soft:#d6eeeb; --accent-line:#8fd0c8;
  --hole:#d9483f; --hole-soft:#fbe4e2;
  --ok:#1f8f55; --ok-soft:#dcf2e5; --warn:#b77a06; --warn-soft:#fbefd4; --bad:#c9372e; --bad-soft:#f9dfdc;
  --viewport-top:#f3f5f7; --viewport-bottom:#dde3e9;
  --shadow-1:0 1px 2px rgba(22,32,43,.08),0 1px 1px rgba(22,32,43,.04);
  --shadow-2:0 6px 24px rgba(22,32,43,.14),0 2px 6px rgba(22,32,43,.08);
  --radius:8px; --radius-s:6px;
  --font:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-cond:"Barlow Semi Condensed","Barlow",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --topbar-h:52px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318; --surface:#161c23; --surface-2:#1b222a; --surface-3:#222a33; --line:#2a333d; --line-strong:#3a4550;
    --ink:#e4e9ee; --ink-2:#c3ccd5; --muted:#93a0ad; --faint:#6d7986;
    --accent:#2cc2ae; --accent-hover:#3fd3bf; --accent-ink:#04211d; --accent-soft:#113c37; --accent-line:#1f7a6f;
    --hole:#ff6a5f; --hole-soft:#3f1c1a;
    --ok:#3ccf82; --ok-soft:#113a25; --warn:#f0b43c; --warn-soft:#3b2d0c; --bad:#ff6b61; --bad-soft:#40191a;
    --viewport-top:#1a2129; --viewport-bottom:#0f1419;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 28px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161c23; --surface-2:#1b222a; --surface-3:#222a33; --line:#2a333d; --line-strong:#3a4550;
  --ink:#e4e9ee; --ink-2:#c3ccd5; --muted:#93a0ad; --faint:#6d7986;
  --accent:#2cc2ae; --accent-hover:#3fd3bf; --accent-ink:#04211d; --accent-soft:#113c37; --accent-line:#1f7a6f;
  --hole:#ff6a5f; --hole-soft:#3f1c1a;
  --ok:#3ccf82; --ok-soft:#113a25; --warn:#f0b43c; --warn-soft:#3b2d0c; --bad:#ff6b61; --bad-soft:#40191a;
  --viewport-top:#1a2129; --viewport-bottom:#0f1419;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 28px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

body.sketching .viewcube{display:none}
#app{height:100%;display:grid;grid-template-rows:var(--topbar-h) 1fr auto;min-height:0}

/* ---------- Kopfzeile ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;padding-right:6px;flex:none;color:var(--ink);text-decoration:none}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font:600 19px/1 var(--font-cond);letter-spacing:.01em}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--radius);padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font:600 14px/1 var(--font-cond);color:var(--muted);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.tools{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1}
.tools::-webkit-scrollbar{display:none}
.tool{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:var(--radius-s);padding:7px 10px;color:var(--ink-2);font:600 14px/1 var(--font-cond);letter-spacing:.02em;white-space:nowrap;flex:none}
.tool svg{width:20px;height:20px;flex:none}
.tool:hover{background:var(--surface-3);color:var(--ink)}
.tool[aria-expanded="true"],.tool.active{background:var(--accent-soft);color:var(--accent)}
.tool.primary{background:var(--accent);color:var(--accent-ink)}
.tool.primary:hover{background:var(--accent-hover)}
.sep{width:1px;height:24px;background:var(--line);margin:0 6px;flex:none}
.tool .l-short{display:none}
.right-tools{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--radius-s);color:var(--ink-2);flex:none}
.icon-btn svg{width:19px;height:19px}
.icon-btn:hover{background:var(--surface-3);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default;background:transparent}
.proj-name{border:0;background:transparent;border-radius:var(--radius-s);padding:6px 8px;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 14px/1 var(--font);color:var(--ink-2)}
.proj-name:hover{background:var(--surface-3)}
.panel-toggle{display:none}

/* ---------- Arbeitsfläche ---------- */
.workspace{display:grid;grid-template-columns:252px minmax(0,1fr) 292px;min-height:0;position:relative}
.workspace.drawing-mode{grid-template-columns:0 minmax(0,1fr) 292px}
.workspace.drawing-mode .left{display:none}
.left,.right{background:var(--surface);min-height:0;display:flex;flex-direction:column;z-index:20}
.left{grid-column:1;grid-row:1}.center{grid-column:2;grid-row:1}.right{grid-column:3;grid-row:1}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.panel-head{display:flex;align-items:center;gap:6px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.panel-title{font:600 13px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 9px;border-radius:6px;font:600 13px/1 var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface-3)}
.panel-body{flex:1;overflow:auto;min-height:0;padding:8px 0 16px}

.center{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--viewport-top),var(--viewport-bottom))}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.overlay-layer{position:absolute;inset:0;pointer-events:none}
.overlay-layer > *{pointer-events:auto}

/* Verlauf / Baum */
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}
.node{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;margin:1px 6px;border-radius:6px;cursor:pointer;user-select:none;min-width:0;position:relative}
.node:hover{background:var(--surface-2)}
.node.sel{background:var(--accent-soft)}
.node .tw{width:16px;height:16px;display:grid;place-items:center;border:0;background:transparent;padding:0;color:var(--faint);flex:none}
.node .tw svg{width:12px;height:12px;transition:transform .15s}
.node .tw.open svg{transform:rotate(90deg)}
.node .swatch{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}
.node .swatch.hole{background:repeating-linear-gradient(135deg,var(--hole) 0 3px,transparent 3px 6px)!important;border-color:var(--hole)}
.node .nm{flex:1 1 auto;min-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.node .sub{color:var(--faint);font-size:12px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.node:hover .sub,.node.sel .sub{display:none}
.node .acts{display:none;gap:2px}
.node:hover .acts,.node.sel .acts{display:flex}
.node .acts button{width:24px;height:24px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;color:var(--muted);padding:0}
.node .acts button:hover{background:var(--surface-3);color:var(--ink)}
.node .acts svg{width:15px;height:15px}
.node.hidden-item .nm{color:var(--faint);text-decoration:line-through}
.node .err{color:var(--bad);display:grid;place-items:center}
.node .err svg{width:15px;height:15px}
.node.drop-before::before,.node.drop-after::after{content:"";position:absolute;left:8px;right:8px;height:2px;background:var(--accent);border-radius:2px}
.node.drop-before::before{top:-2px}.node.drop-after::after{bottom:-2px}
.node.drop-into{outline:2px solid var(--accent);outline-offset:-2px}
.finish-row{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 30px;margin:0 6px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer}
.finish-row:hover{background:var(--surface-2)}
.finish-row svg{width:14px;height:14px}
.finish-row.bad{color:var(--bad)}
.empty-tree{padding:18px 16px;color:var(--muted);font-size:14px;line-height:1.5}
.empty-tree b{color:var(--ink)}

/* Eigenschaften */
.props{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:12px 14px}
.prop-title{display:flex;align-items:center;gap:8px;min-width:0}
.prop-title input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font:600 17px/1.2 var(--font);margin-left:-6px}
.prop-title input:hover{border-color:var(--line)}
.prop-title input:focus{border-color:var(--accent);background:var(--surface)}
.kind-badge{font:600 12px/1 var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-3);padding:4px 7px;border-radius:5px;white-space:nowrap}
.section{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.section-h{display:flex;align-items:center;justify-content:space-between;font:600 12px/1 var(--font-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
/* drei Felder nebeneinander: Einheit steht in der Überschrift, damit Zahlen wie 12,5 ganz zu sehen sind */
.fields.three .inp .unit{display:none}
.fields.three .inp input{padding:0 5px 0 6px}
.fields.one{grid-template-columns:minmax(0,1fr)}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;height:34px;transition:border-color .12s}
.inp:hover{border-color:var(--line-strong)}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp input,.inp select{border:0;background:transparent;min-width:0;width:100%;padding:0 8px;height:100%;font:500 14px/1 var(--font-mono);font-variant-numeric:tabular-nums;outline:none}
.inp select{font-family:var(--font);cursor:pointer}
.inp .unit{color:var(--faint);font-size:12px;padding-right:8px;font-family:var(--font)}
.inp .axis{font:600 12px/1 var(--font-cond);padding-left:8px;flex:none}
.inp .axis.x{color:#d24a3c}.inp .axis.y{color:#3a9a3f}.inp .axis.z{color:#3067d0}
.inp.expr{border-style:dashed;border-color:var(--accent-line)}
.inp.invalid{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.inp .fx{font:600 11px/1 var(--font-mono);color:var(--accent);padding-right:6px}
.role-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-3);padding:3px;border-radius:var(--radius);gap:3px}
.role-switch button{border:0;border-radius:6px;padding:8px 6px;background:transparent;display:flex;align-items:center;justify-content:center;gap:7px;font:600 14px/1 var(--font-cond);letter-spacing:.02em;color:var(--muted)}
.role-switch button svg{width:17px;height:17px}
.role-switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.role-switch button.hole[aria-pressed="true"]{color:var(--hole)}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.colors button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.more{border:0;background:transparent;padding:4px 0;color:var(--accent);font:600 13px/1 var(--font-cond);letter-spacing:.04em;display:flex;align-items:center;gap:5px}
.more svg{width:13px;height:13px;transition:transform .15s}
.more[aria-expanded="true"] svg{transform:rotate(90deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 12px;font:600 14px/1 var(--font-cond);letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn:hover{border-color:var(--line-strong);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.small{padding:6px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:6px}
.hint-box{font-size:13.5px;line-height:1.5;color:var(--muted);background:var(--surface-2);border-radius:var(--radius-s);padding:10px 12px}
.hint-box b{color:var(--ink)}
.err-box{font-size:13.5px;line-height:1.45;color:var(--bad);background:var(--bad-soft);border-radius:var(--radius-s);padding:9px 11px;display:grid;gap:6px}
.kbd{font:500 11.5px/1 var(--font-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--muted);background:var(--surface)}
.mini-list{display:grid;gap:4px}
.mini-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:var(--surface-2);font-size:13.5px}
.mini-row .grow{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* ---------- Fußzeile ---------- */
.bottombar{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,560px) minmax(0,1fr);align-items:center;gap:12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:25}
.hintline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;line-height:1.3;min-width:0}
.hintline svg{width:17px;height:17px;flex:none;color:var(--accent)}
.hintline span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hintline b{color:var(--ink);font-weight:600}
.cmd{position:relative}
.cmd-box{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:22px;background:var(--surface-2);height:40px;padding:0 6px 0 14px;transition:border-color .12s,box-shadow .12s}
.cmd-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.cmd-box svg.spark{width:18px;height:18px;color:var(--accent);flex:none}
.cmd-box input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.cmd-box .go{width:30px;height:30px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.cmd-box .go svg{width:16px;height:16px}
.cmd-box .go:disabled{background:var(--surface-3);color:var(--faint);cursor:default}
.cmd-pop{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:6px;display:grid;gap:2px;max-height:min(60vh,420px);overflow:auto}
.cmd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14.5px}
.cmd-item svg{width:18px;height:18px;color:var(--muted);flex:none}
.cmd-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-item .k{color:var(--faint);font-size:12px}
.cmd-item.on{background:var(--accent-soft)}
.cmd-item.ai svg{color:var(--accent)}
.cmd-group{font:600 11.5px/1 var(--font-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.ampel-wrap{display:flex;justify-content:flex-end;min-width:0}
.ampel{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px 6px 9px;font:600 14px/1 var(--font-cond);letter-spacing:.02em;color:var(--ink-2);max-width:100%;min-width:0}
.ampel span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ampel .dot{width:12px;height:12px;border-radius:50%;background:var(--faint);flex:none;box-shadow:0 0 0 3px var(--surface-3)}
.ampel.ok .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.ampel.warn .dot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.ampel.bad .dot{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.ampel.none .dot{background:var(--faint);box-shadow:0 0 0 3px var(--surface-3)}
.ampel.none{color:var(--muted)}
.ampel:hover{border-color:var(--line-strong)}

/* ---------- Schwebende Elemente ---------- */
.flyout{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:12px;display:grid;gap:10px;width:min(420px,calc(100vw - 24px))}
.flyout h3{margin:0;font:600 13px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{display:grid;justify-items:center;gap:6px;padding:10px 6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:600 13.5px/1.1 var(--font-cond);letter-spacing:.02em;color:var(--ink-2);cursor:grab;user-select:none;text-align:center}
.tile:hover{border-color:var(--accent-line);background:var(--surface);color:var(--ink)}
.tile svg{width:46px;height:46px}
.tile .lbl{max-width:100%;hyphens:manual;overflow-wrap:anywhere;line-height:1.15}
.tile .role{font:500 11px/1 var(--font);color:var(--faint);letter-spacing:0}
.tile.hole-part .role{color:var(--hole)}
.flyout .foot{font-size:12.5px;color:var(--faint)}
.ctxbar{position:absolute;z-index:15;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);padding:4px;transform:translate(-50%,0);white-space:nowrap;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.ctxbar::-webkit-scrollbar{display:none}
.ctxbar button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:7px;padding:7px 9px;font:600 13.5px/1 var(--font-cond);letter-spacing:.02em;color:var(--ink-2);flex:none}
.ctxbar button svg{width:17px;height:17px}
.ctxbar button:hover{background:var(--surface-3);color:var(--ink)}
.ctxbar button.accent{color:var(--accent)}
.ctxbar button.danger:hover{color:var(--bad)}
.ctxbar .lbl{font:600 11.5px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 6px 0 8px}
.ctxbar .vsep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line)}
.dimlabel{position:absolute;transform:translate(-50%,-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:5px;padding:3px 6px;font:500 12.5px/1 var(--font-mono);white-space:nowrap;box-shadow:var(--shadow-1);cursor:text;user-select:none}
.dimlabel.live{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);pointer-events:none!important}
.dimlabel input{width:64px;border:0;outline:none;background:transparent;font:inherit;color:inherit;padding:0}
.dimlabel.editing{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.snaptip{pointer-events:none!important;position:absolute;transform:translate(10px,-26px);background:var(--ink);color:var(--surface);border-radius:4px;padding:3px 6px;font:600 11.5px/1 var(--font-cond);letter-spacing:.04em;pointer-events:none;white-space:nowrap}
.numentry{position:absolute;transform:translate(14px,14px);display:flex;gap:4px;background:var(--surface);border:1px solid var(--accent);border-radius:7px;box-shadow:var(--shadow-2);padding:4px}
.numentry label{display:flex;align-items:center;gap:4px;font:600 11.5px/1 var(--font-cond);color:var(--muted);letter-spacing:.04em;padding-left:4px}
.numentry input{width:62px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font:500 13px/1 var(--font-mono);outline:none;background:var(--surface)}
.numentry input:focus{border-color:var(--accent)}

.viewcube{position:absolute;top:14px;right:18px;width:104px;height:104px;perspective:900px;z-index:12;user-select:none}
.viewcube .cube{position:absolute;left:22px;top:22px;width:60px;height:60px;transform-style:preserve-3d}
.viewcube .face{position:absolute;left:0;top:0;width:60px;height:60px;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1.5px solid var(--line-strong);font:600 10.5px/1 var(--font-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;backface-visibility:hidden;transition:background .12s,color .12s}
.viewcube .face:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.view-btns{position:absolute;right:12px;bottom:12px;display:grid;gap:6px;z-index:12}
.view-btns button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow-1)}
.view-btns button:hover{color:var(--ink);border-color:var(--line-strong)}
.view-btns button.on{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.view-btns .sep{height:4px}
/* ---------- Zeitleiste ---------- */
.timeline{position:absolute;left:84px;right:62px;bottom:10px;height:46px;z-index:12;display:flex;align-items:center;gap:6px;padding:0 6px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:var(--shadow-1);user-select:none}
.timeline[hidden]{display:none}
body.sketching .timeline{display:none}
.tl-btns{display:flex;gap:2px;flex:none}
.tl-btns button{width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--ink-2);display:grid;place-items:center}
.tl-btns button:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
.tl-btns button:disabled{opacity:.35}
.tl-btns svg{width:16px;height:16px}
.tl-track{position:relative;flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:0 4px}
.tl-empty{color:var(--muted);font-size:13px;padding-left:4px;white-space:nowrap}
.tl-chip{position:relative;flex:none;width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;padding:0}
.tl-chip svg{width:17px;height:17px}
.tl-chip:hover{border-color:var(--line-strong);color:var(--ink)}
.tl-chip .bar{position:absolute;left:5px;right:5px;bottom:2px;height:3px;border-radius:2px}
.tl-chip.hole{color:var(--hole)}
.tl-chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tl-chip.off{opacity:.38;border-style:dashed}
.tl-chip.sup{opacity:.5}
.tl-chip.sup::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:1.7px;background:var(--ink-2);transform:rotate(-40deg)}
.tl-chip.err{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tl-chip.err::before{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.tl-marker{flex:none;width:12px;height:38px;cursor:ew-resize;display:grid;place-items:center;touch-action:none}
.tl-marker i{display:block;width:4px;height:100%;border-radius:2px;background:var(--accent)}
.tl-marker:hover i,.tl-marker.drag i{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-drop{flex:none;width:4px;height:34px;border-radius:2px;background:var(--accent);opacity:.45}
.tl-info{flex:none;font:600 12px/1 var(--font-cond);color:var(--muted);letter-spacing:.03em;padding:0 4px;white-space:nowrap}
.timeline.ctx{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-1)}
.ctx-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:13;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow-2);white-space:nowrap}
.ctx-banner.iso{background:var(--ink);color:var(--surface)}
.ctx-banner svg{width:16px;height:16px}
.ctx-banner button{border:0;border-radius:7px;padding:5px 10px;background:rgba(255,255,255,.18);color:inherit;font-weight:600;cursor:pointer}
.ctx-banner button:hover{background:rgba(255,255,255,.3)}
.node.ctx-other{opacity:.4}
.node .swatch.comp{display:grid;place-items:center;background:none!important;border:0;color:var(--accent)}
.node .swatch.comp svg{width:14px;height:14px}
.node.ctx-active{box-shadow:inset 3px 0 0 var(--accent)}
.drag-input{position:absolute;z-index:30;display:flex;gap:6px;align-items:center;padding:5px 7px;border-radius:8px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow-2);font:600 12px/1 var(--font-cond)}
.drag-input input{width:64px;border:0;border-radius:5px;padding:4px 6px;font:500 13px var(--font-mono,monospace);background:var(--surface);color:var(--ink)}
.drag-input small{opacity:.6;font-weight:500}
.center.has-tl .view-btns{bottom:66px}
.center.has-tl .axis-gizmo{bottom:62px}
/* ---------- Protokoll ---------- */
.log-tools{display:flex;gap:4px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.log-tools .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.log-tools .seg button{border:0;background:none;padding:5px 9px;font-size:12px;color:var(--ink-2)}
.log-tools .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.log-list{display:grid;gap:2px}
.log-row{display:grid;grid-template-columns:auto 18px 1fr;gap:7px;align-items:start;padding:6px 6px;border-radius:7px;font-size:13px;line-height:1.35}
.log-row:hover{background:var(--surface-3)}
.log-row .tm{font:500 11px/1.6 var(--font-mono,monospace);color:var(--muted)}
.log-row svg{width:15px;height:15px;margin-top:1px;color:var(--ink-2)}
.log-row.error svg{color:var(--bad)}.log-row.error b{color:var(--bad)}
.log-row.undo svg,.log-row.redo svg{color:var(--muted)}
.log-row small{display:block;color:var(--muted);margin-top:2px}
.log-row .lk{border:0;background:none;padding:0;color:var(--accent);font-size:12px;cursor:pointer;margin-top:3px;text-decoration:underline;text-underline-offset:2px}
.log-row.gone{opacity:.45}
.node.supp .nm{text-decoration:line-through;opacity:.6}
.node.rolled{opacity:.42}

.view-btns svg{width:19px;height:19px}
.axis-gizmo{position:absolute;left:12px;bottom:12px;width:64px;height:64px;pointer-events:none;z-index:11}
.sketchbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:16;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:5px;max-width:calc(100% - 140px);overflow-x:auto;scrollbar-width:none}
.sketchbar::-webkit-scrollbar{display:none}
.sketchbar .tool{padding:7px 9px}
.sketchbar .tool:not(.active):not(.primary):not(.labeled) span{display:none}
.sketchbar .tool.active span{display:inline}
.sketchbar .title{font:600 12px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0 10px 0 8px;white-space:nowrap}
.pull-arrow{position:absolute;width:30px;height:58px;z-index:15;cursor:grab;touch-action:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.pull-arrow:active{cursor:grabbing}
.pull-arrow svg{width:100%;height:100%;display:block;overflow:visible}
.pull-arrow .pa-head{fill:#fff;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.pull-arrow .pa-shaft{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
.pull-arrow .pa-base{fill:var(--accent);stroke:#fff;stroke-width:2}
.pull-arrow:hover .pa-head{fill:var(--accent-soft)}
.stepbox{position:absolute;top:12px;left:12px;z-index:16;width:min(300px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:14px;display:grid;gap:12px}
.stepbox h3{margin:0;font:600 16px/1.2 var(--font)}
.stepbox p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.stepbox .btn-row{flex-wrap:nowrap}

.toasts{position:fixed;left:50%;bottom:calc(86px + var(--ai-h, 0px));transform:translateX(-50%);display:grid;gap:8px;z-index:90;pointer-events:none;width:min(520px,calc(100vw - 32px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 12px 10px 14px;box-shadow:var(--shadow-2);font-size:14px;line-height:1.35;animation:toastIn .18s ease-out}
.toast svg{width:18px;height:18px;flex:none}
.toast .grow{flex:1}
.toast button{border:0;background:transparent;color:var(--accent-line);font:600 13.5px/1 var(--font-cond);letter-spacing:.03em;padding:6px 8px;border-radius:6px}
.toast button:hover{background:rgba(255,255,255,.08)}
.toast.bad{background:var(--bad);color:#fff}
.toast.bad button{color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.modal-back{position:fixed;inset:0;background:rgba(10,16,22,.42);z-index:80;display:grid;place-items:center;padding:16px;animation:fadeIn .15s}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-2);width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;gap:14px;padding:20px}
.modal.wide{width:min(860px,100%)}
.modal h2{margin:0;font:600 21px/1.2 var(--font);text-wrap:balance}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.tooltip{position:fixed;z-index:95;background:var(--ink);color:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;line-height:1.3;pointer-events:none;max-width:260px;box-shadow:var(--shadow-2)}
.tooltip.big{max-width:300px;padding:9px 11px}
.tooltip .hl{display:block;margin-top:6px;opacity:.92;font-weight:400}
.tooltip .tp{display:block;margin-top:6px;opacity:.8;font-size:12px}
.tooltip .tp b{font-weight:600}
.tooltip .more{display:block;margin-top:4px;opacity:.55;font-size:11px}
.tooltip .kbd{background:transparent;color:var(--faint);border-color:var(--faint);margin-left:6px}

.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:50;background:linear-gradient(180deg,var(--viewport-top),var(--viewport-bottom))}
.loading .box{display:grid;gap:12px;justify-items:center;text-align:center;padding:24px;max-width:360px}
.loading .bar{width:220px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.loading b{font:600 16px/1.2 var(--font)}
.loading span{color:var(--muted);font-size:13.5px}
.busy{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:14;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px 5px 10px;display:flex;align-items:center;gap:8px;font:600 13px/1 var(--font-cond);color:var(--muted);box-shadow:var(--shadow-1);letter-spacing:.03em}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.ai-panel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:17;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-2);padding:12px 14px;display:grid;gap:10px;max-height:min(46vh,380px);overflow:auto}
.ai-msg{display:grid;gap:4px;font-size:14.5px;line-height:1.5}
.ai-msg .who{font:600 11.5px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ai-msg.me .txt{color:var(--ink-2)}
.ai-msg.ai .who{color:var(--accent)}
.ai-msg .txt{white-space:pre-wrap}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ai-head b{font:600 13px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.ai-head b svg{width:16px;height:16px}

.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:12px;display:grid;gap:10px;width:min(340px,calc(100vw - 24px))}
.menu{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);padding:5px;display:grid;min-width:210px}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:6px;padding:8px 10px;text-align:left;font-size:14px;color:var(--ink)}
.menu button svg{width:17px;height:17px;color:var(--muted)}
.menu button:hover{background:var(--surface-2)}
.menu button .k{margin-left:auto;color:var(--faint);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.check-list{display:grid;gap:6px}
.check-row{display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.4}
.check-row .st{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:50%;margin-top:1px}
.check-row .st svg{width:12px;height:12px}
.check-row.ok .st{background:var(--ok-soft);color:var(--ok)}
.check-row.warn .st{background:var(--warn-soft);color:var(--warn)}
.check-row.bad .st{background:var(--bad-soft);color:var(--bad)}
.check-row .grow{flex:1;min-width:0}
.check-row small{display:block;color:var(--muted);font-size:12.5px}

/* Startseite */
.start{position:fixed;inset:0;z-index:85;background:var(--bg);overflow:auto;padding-inline:16px}
.start-inner{max-width:1040px;margin:0 auto;padding-block:40px 60px;display:grid;gap:28px}
.start-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.start-brand{display:flex;align-items:center;gap:12px}
.start-brand svg{width:40px;height:40px}
.start-brand h1{margin:0;font:600 34px/1 var(--font-cond);letter-spacing:.005em}
.start-brand p{margin:4px 0 0;color:var(--muted)}
.start h2{margin:0 0 12px;font:600 13px/1 var(--font-cond);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{display:grid;gap:8px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.card .thumb{aspect-ratio:16/10;border-radius:8px;background:linear-gradient(180deg,var(--viewport-top),var(--viewport-bottom));display:grid;place-items:center;overflow:hidden}
.card .thumb svg{width:64%;height:auto}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card b{font:600 16px/1.2 var(--font)}
.card span{font-size:13px;color:var(--muted);line-height:1.4}
.card.new .thumb{background:var(--accent-soft);color:var(--accent)}
.card.new .thumb svg{width:34%}
.recent{display:grid;gap:6px}
.recent-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.recent-row:hover{border-color:var(--accent-line)}
.recent-row .grow{flex:1;min-width:0}
.recent-row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-row span{font-size:12.5px;color:var(--muted)}
.start-foot{color:var(--faint);font-size:12.5px;line-height:1.6}

/* Tour */
.tour{position:fixed;z-index:88;width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--accent-line);border-radius:14px;box-shadow:var(--shadow-2);padding:16px;display:grid;gap:10px}
.tour .step{font:600 12px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tour h3{margin:0;font:600 17px/1.25 var(--font)}
.tour p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.tour-ring{position:fixed;z-index:87;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 4px var(--accent-soft);pointer-events:none;transition:all .25s}

/* Zeichnung */
.sheet-wrap{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;padding:24px;background:var(--surface-3)}
.sheet-wrap.panning{cursor:grabbing}
.sheet-holder{position:relative;box-shadow:var(--shadow-2);background:#fff;flex:none}
.sheet-holder svg{display:block}
.dwgbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:16;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-2);padding:5px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.dwgbar .tool{padding:7px 9px}
.zoom-btns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:12}

@media (max-width: 1100px){

}

  .left,.right{position:absolute;top:0;bottom:0;width:min(300px,86vw);box-shadow:var(--shadow-2);transition:transform .2s ease}

function makeEmitter() {
  const map = new Map();
  return {
    on(ev, fn) { if (!map.has(ev)) map.set(ev, new Set()); map.get(ev).add(fn); return () => map.get(ev).delete(fn); },
    emit(ev, ...a) { const s = map.get(ev); if (s) for (const fn of [...s]) { try { fn(...a); } catch (e) { console.error(e); } } },
  };
}
const Bus = makeEmitter();

// ================= Verbindung zum CAD-Kern (Web Worker) =================
const Kernel = (() => {
  let worker = null, seq = 1, ready = false;
  const pending = new Map();
  let readyResolve, readyReject;
  const readyPromise = new Promise((res, rej) => { readyResolve = res; readyReject = rej; });
  readyPromise.catch(() => {}); // Fehler zeigt der Startbildschirm

  async function fetchWasm(onProgress) {
    const resp = await fetch('occ-kernel.wasm');
    if (!resp.ok) throw new Error('Der CAD-Kern konnte nicht geladen werden (Fehler ' + resp.status + ').');
    const total = +resp.headers.get('content-length') || 7200000;
    let bytes;
    if (resp.body && resp.body.getReader) {
      const reader = resp.body.getReader(); const chunks = []; let got = 0;
      for (;;) { const { done, value } = await reader.read(); if (done) break; chunks.push(value); got += value.length; onProgress && onProgress(Math.min(0.95, got / total) * 0.8); }
      bytes = new Uint8Array(got); let o = 0; for (const c of chunks) { bytes.set(c, o); o += c.length; }
    } else bytes = new Uint8Array(await resp.arrayBuffer());
    if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Dieser Browser ist zu alt für Tracery. Bitte aktualisiere ihn.');
      const ds = new DecompressionStream('gzip');
      bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
    }
    onProgress && onProgress(0.85);
    return bytes;
  }
  // Worker starten: direkt als Datei, sonst über einen kleinen Blob, der die Datei importiert
  // (manche Umgebungen erlauben nur eins von beiden). Erst die „geladen“-Meldung zählt als Start.
  function spawn(kind) {
    return new Promise((resolve, reject) => {
      const abs = new URL('kernel/worker.js', location.href).href;
      let w;
      try {
        w = kind === 'direct' ? new Worker(abs, { type: 'module' }) : new Worker(URL.createObjectURL(new Blob([`import ${JSON.stringify(abs)};`], { type: 'text/javascript' })), { type: 'module' });
      } catch (e) { reject(e); return; }
      const t = setTimeout(() => { try { w.terminate(); } catch (_) {} reject(new Error('Der CAD-Kern antwortet nicht.')); }, 45000);
      w.onmessage = (ev) => { if (ev.data && ev.data.id === 0) { clearTimeout(t); resolve(w); } };
      w.onerror = (e) => { clearTimeout(t); try { w.terminate(); } catch (_) {} reject(new Error((e && e.message) || 'Der CAD-Kern startet nicht.')); };
    });
  }
  async function start(onProgress) {
    try {
      const wasmP = fetchWasm(onProgress);
      wasmP.catch(() => {});
      let w;
      try { w = await spawn('direct'); } catch (e1) { console.warn('Kern-Worker direkt nicht gestartet:', e1); w = await spawn('blob'); }
      worker = w;
      worker.onmessage = (ev) => {
        const { id, ok, result, error } = ev.data || {};
        if (id === 0) return; // geladen
        const p = pending.get(id); if (!p) return;
        pending.delete(id);
        ok ? p.resolve(result) : p.reject(new Error(error));
      };
      worker.onerror = (e) => {
        const err = new Error('Der CAD-Kern ist abgestürzt: ' + ((e && e.message) || 'unbekannter Fehler'));
        for (const p of pending.values()) p.reject(err); pending.clear();
        if (!ready) readyReject(err);
      };
      const wasm = await wasmP;
      const info = await call('init', { wasm: wasm.buffer }, [wasm.buffer]);
      ready = true; onProgress && onProgress(1);
      readyResolve(info);
      return info;
    } catch (e) { readyReject(e); throw e; }
  }
  function call(cmd, args = {}, transfer = []) {
    return new Promise((resolve, reject) => {
      const id = seq++;
      pending.set(id, { resolve, reject });
      worker.postMessage({ id, cmd, args }, transfer);
    });
  }
  return { start, call, get ready() { return ready; }, whenReady: () => readyPromise };
})();

  function change(label, fn, opts = {}) {

// ---------- Maus-Bedienung ----------
const Interact = (() => {
  let down = null, moving = null, hoverTimer = 0, lastHover = null;
  function init() {
    const cv = Viewer.canvas;
    cv.addEventListener('pointerdown', onDown, true);
    cv.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    cv.addEventListener('pointerleave', () => { if (!down) { Viewer.clearHover(); Handles.hover(null); } });
    cv.addEventListener('dblclick', onDbl);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', onKey, true);
    window.addEventListener('pointermove', (e) => { lastPtr = { x: e.clientX, y: e.clientY }; }, { passive: true });
  }
  function modelActive() { return App.mode === 'model' && !Sketch.active && !Place.active && !Measure.active; }
  function onDown(e) {
    if (!modelActive()) return;
    if (e.button !== 0) return;
    const hnd = Handles.hitHandle(e.clientX, e.clientY);
    if (hnd) {
      Viewer.controls.enabled = false;
      if (Handles.start(hnd, e)) { down = { handle: true }; Viewer.canvas.setPointerCapture(e.pointerId); }
      return;
    }
    // gewähltes Unterobjekt (z. B. ein Loch in einer Gruppe) direkt ziehen
    if (App.sel.length === 1 && !App.doc.items.find((x) => x.id === App.sel[0])) {
      const gh = Viewer.pickGhost(e.clientX, e.clientY);
      if (gh && gh.id === App.sel[0]) {
        const f = Model.find(App.doc, gh.id);
        if (f && !f.item.locked) {
          Viewer.controls.enabled = false;
          down = { x: e.clientX, y: e.clientY, child: true };
          const W = Model.worldMatrix(App.doc, gh.id);
          const q = new THREE.Quaternion(); W.decompose(new THREE.Vector3(), q, new THREE.Vector3());
          const nrm = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
          moving = { child: f.item, before: App.snapshot(), start: gh.point.clone(), normal: nrm, t0: Model.tNumeric(f.item), q, PW: Model.parentWorld(App.doc, gh.id) };
          return;
        }
      }
    }
    const hit = Viewer.pick(e.clientX, e.clientY);
    down = { x: e.clientX, y: e.clientY, hit, t: performance.now(), shift: e.shiftKey || e.metaKey || e.ctrlKey };
    if (hit) {
      const top = App.doc.items.find((x) => x.id === hit.id);
      if (top && !top.locked) Viewer.controls.enabled = false; // Körper ziehen statt Ansicht drehen
    }
  }
  function onMove(e) {
    if (!modelActive()) return;
    if (down && down.kbd) return;
    if (down && down.handle) { Handles.move(e); return; }
    if (down && down.child && moving) { doMove(e); return; }
    if (down && down.hit && !moving) {
      if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4) startMove(e);
    }
    if (moving) { doMove(e); return; }
    if (down) return;

    cancelAnimationFrame(hoverTimer);
    hoverTimer = requestAnimationFrame(() => {
      const hnd = Handles.hitHandle(e.clientX, e.clientY);
      Handles.hover(hnd);
      if (hnd) { Viewer.canvas.style.cursor = hnd.userData.kind === 'rot' ? 'grab' : 'pointer'; Viewer.clearHover(); return; }
      const hit = Viewer.pick(e.clientX, e.clientY);
      if (hit && hit.edgeIdx != null) { Viewer.highlightEdge(hit.id, hit.edgeIdx); Viewer.highlightFace('hover', null, null); }
      else if (hit) { Viewer.highlightEdge(null, null); Viewer.highlightFace('hover', hit.id, hit.faceIdx); }
      else Viewer.clearHover();
      const id = hit ? hit.id : null;
      if (lastHover !== id) { if (lastHover) Viewer.updateNode(lastHover, { hover: false }); if (id) Viewer.updateNode(id, { hover: true }); lastHover = id; }
      Viewer.canvas.style.cursor = hit ? 'pointer' : '';
    });
  }
  function startMove(e) {
    const hit = down.hit; const top = App.doc.items.find((x) => x.id === hit.id);
    if (!top || top.locked) { down = null; Viewer.controls.enabled = true; return; }
    if (!App.sel.includes(top.id)) App.select([top.id]);
    const ids = App.sel.map((id) => App.doc.items.find((x) => x.id === id)).filter((x) => x && !x.locked);
    const planeZ = hit.point.z;
    moving = { ids, before: App.snapshot(), start: hit.point.clone(), planeZ, t0: new Map(ids.map((it) => [it.id, Model.tNumeric(it)])) };
    Viewer.canvas.style.cursor = 'grabbing';

  }
  const liveRebuild = throttle(() => App.rebuild(), 90);
  let moveLabel = null;
  function doMove(e) {
    if (moving.child) return doMoveChild(e);

    const dl = dW.clone().applyQuaternion(qi);
    const grid = App.doc.settings.snap === false ? 0 : (e.shiftKey ? 0.1 : App.doc.settings.grid || 1);
    if (grid) { dl.x = Math.round(dl.x / grid) * grid; dl.y = Math.round(dl.y / grid) * grid; }
    dl.z = 0;
    const dW2 = dl.applyQuaternion(m.q);
    const pq = new THREE.Quaternion(); m.PW.decompose(new THREE.Vector3(), pq, new THREE.Vector3());
    const dP = dW2.applyQuaternion(pq.invert());
    m.child.t = { ...m.t0, x: round(m.t0.x + dP.x, 4), y: round(m.t0.y + dP.y, 4), z: round(m.t0.z + dP.z, 4) };

  }

  function onUp(e) {

    if (down && down.handle) { Handles.end(); down = null; Viewer.controls.enabled = true; return; }

    }

  }

    if (hit.edgeIdx != null) {
      if (additive && App.sel.length === 1 && App.sel[0] === id) {
        const list = App.edges.filter((x) => !(x.id === id && x.edgeIdx === hit.edgeIdx));
        if (list.length === App.edges.length) list.push({ id, edgeIdx: hit.edgeIdx });

// ---- 48-refine.js ----
// ================= Nachschärfen: feineres Netz für Teile, die von nah angesehen werden =================
const Refine = (() => {
  const cur = new Map();   // id -> { key, tol }
  let busy = false, again = false;
  function wanted(n) {
    const box = n.mesh.geometry.boundingBox.clone().applyMatrix4(n.obj.matrix);
    if (!Viewer.boxVisible(box)) return null;
    const size = box.getSize(new THREE.Vector3()); const diag = size.length();
    const near = box.clampPoint(Viewer.controls.target, new THREE.Vector3());
    const px = Viewer.pixelSizeAt(near);
    return Math.max(px * 0.6, diag * 2e-5, 0.0005);
  }
  async function run() {
    if (busy) { again = true; return; }
    if (!ViewPrefs.get().adaptive || !Kernel.ready || App.busy || App.mode !== 'model') return;
    busy = true;
    try {
      for (const [id, n] of Viewer.nodes) {
        const r = App.results.get(id); if (!r || !r.key || !n.obj.visible) continue;
        let c = cur.get(id);
        if (!c || c.key !== r.key) { const b0 = (r.data && r.data.tol) || 0.05; c = { key: r.key, tol: b0, base: b0 }; cur.set(id, c); }
        const base = c.base;
        const w = wanted(n); if (w == null) continue;
        let target = null;
        if (w < c.tol * 0.5) target = w;                                   // näher dran: feiner
        else if (c.tol < base && w > c.tol * 4) target = Math.min(base, w); // weit weg: Speicher sparen
        if (target == null) continue;
        try {
          const payload = await Kernel.call('remesh', { key: r.key, tol: target });
          if (App.replaceMesh(id, r.key, payload)) cur.set(id, { key: r.key, tol: payload.tol || target, base });
        } catch (_) { cur.set(id, { key: r.key, tol: 0, base }); }   // Form nicht mehr im Speicher: bis zur nächsten Änderung nicht erneut versuchen
      }
    } finally { busy = false; }
    if (again) { again = false; schedule(); }
  }
  const schedule = debounce(run, 450);
  function init() { Viewer.on('camera', schedule); App.on('results', () => { for (const [id, c] of cur) { const r = App.results.get(id); if (!r || r.key !== c.key || (r.data && r.data.tol > c.tol && c.tol === c.base)) cur.delete(id); } schedule(); }); ViewPrefs.on('change', () => { cur.clear(); schedule(); }); }
  return { init };
})();

  let el, track, info, bStart, bPrev, bNext, bEnd, drag = null;

  }
  // Zeitleiste des Projekts – oder des Bauteils, das gerade bearbeitet wird
  function owner(doc = App.doc) { const c = App.ctx ? doc.items.find((x) => x.id === App.ctx) : null; return c || doc; }

  const markerPos = () => { const o = owner(); const n = listOf(o).length; return o.rollback == null ? n : clamp(o.rollback, 0, n); };
  function setMarker(k, label) {

    App.change(label || (k >= n ? 'Zeitleiste: ans Ende' : `Zeitleiste: Marker nach Schritt ${k}`), (doc) => { const o = owner(doc); o.rollback = k >= listOf(o).length ? null : k; }, { merge: 'timeline' });

  }
  function chipTip(it, i, V) {

    return `${i + 1}. ${Model.label(it)}${Model.sizeText(it, V) ? ' · ' + Model.sizeText(it, V) : ''}${st}${errs.length ? ' · ' + errs[0].message : ''}`;
  }
  function render() {

      c.onclick = (e) => App.select([it.id], { additive: e.shiftKey || e.metaKey || e.ctrlKey });

  }
  function menu(anchor, it, i) {

// ================= Zahleneingabe beim Ziehen =================
// Während man zieht, einfach eine Zahl tippen: Eingabefeld erscheint, Enter übernimmt den exakten Wert.
const DragInput = (() => {
  let el = null, spec = null;
  function open(sp, firstChar, at) {
    close(); spec = sp;
    el = h('div', { class: 'drag-input', role: 'dialog', 'aria-label': 'Wert eingeben' });
    const inputs = sp.fields.map((f, i) => {
      const inp = h('input', { type: 'text', value: i === 0 && firstChar != null ? firstChar : fmt(f.value, 3), 'aria-label': f.label, inputmode: 'decimal' });
      el.append(h('span', null, f.label), inp); if (f.unit) el.append(h('small', null, f.unit));
      return inp;
    });
    el.append(h('small', null, '↵ übernehmen · Tab wechseln · Esc'));
    const r = $('#overlay').getBoundingClientRect();
    el.style.left = clamp(at.x - r.left + 14, 8, r.width - 340) + 'px'; el.style.top = clamp(at.y - r.top - 54, 8, r.height - 40) + 'px';
    $('#overlay').append(el);
    const first = inputs[0]; first.focus(); if (firstChar == null) first.select(); else first.setSelectionRange(first.value.length, first.value.length);
    el.addEventListener('keydown', (e) => {
      e.stopPropagation();

})();

// ---- 49-log.js ----
// ================= Protokoll: jede Änderung mit Uhrzeit, Fehler in normaler Sprache =================
const Log = (() => {
  const MAX = 300; const ev = makeEmitter();
  const session = uid('s');          // Rückgängig-Sprünge gehen nur innerhalb dieser Sitzung
  let docId = null, list = [];
  const HINT = {
    edges: 'Eine frühere Änderung hat die gewählten Kanten verändert. Körper anklicken und die Kanten für Rundung oder Fase neu auswählen.',
    toobig: 'Den Radius kleiner machen oder die Kante länger.',
    build: 'Die Maße dieses Schritts prüfen – z. B. ob eine Wand dünner als null wird.',
    cut: 'Prüfen, ob das Loch den Körper überhaupt berührt.',
    mesh: 'Ein Maß leicht ändern und erneut versuchen.',
  };
  const key = (id) => 'masswerk.log.' + id;
  function load(id) { docId = id; try { list = JSON.parse(storageGet(key(id)) || '[]'); } catch (_) { list = []; } }
  const save = debounce(() => { if (docId) storageSet(key(docId), JSON.stringify(list.slice(-MAX))); }, 600);
  function add(e) {
    if (App.doc.id !== docId) load(App.doc.id);
    const it = e.itemId ? Model.find(App.doc, e.itemId) : null;
    list.push({ t: Date.now(), s: session, ...e, name: it ? Model.label(it.item) : e.name });
    if (list.length > MAX) list = list.slice(-MAX);
    save(); ev.emit('change');
  }
  function entries() { if (App.doc.id !== docId) load(App.doc.id); return list; }
  function clear() { list = []; save.flush(); ev.emit('change'); }
  function hint(code) { const k = ERROR_FOR_CODE[code]; return k && ERRORS[k] ? ERRORS[k].loesung : (HINT[code] || ''); }
  function init() {
    App.on('log', add);
    App.on('doc', () => { if (App.doc.id !== docId) { load(App.doc.id); add({ kind: 'info', text: `Projekt geöffnet: ${App.doc.name}` }); } });
  }
  return { init, entries, clear, hint, on: ev.on, get session() { return session; } };
})();

const Place = (() => {

    const d = spec.part; const p = libDefaults(d);
    if (d.lib === 'screwHole') return [-3.5, -3.5, -(p.length || 10), 3.5, 3.5, 0.2];
    if (d.lib === 'nutTrap') return [-3.5, -3.5, -12, 3.5, 3.5, 0.2];
    if (d.lib === 'insert') return [-2, -2, -7.7, 2, 2, 0.2];
    if (d.lib === 'slotHole') return [-10, -2.3, -10, 10, 2.3, 0.2];
    if (d.lib === 'snapHook') return [0, -4, 0, 2.8, 4, 12];
    if (d.lib === 'hinge') return [-20, -17.5, 0, 20, 17.5, 5.3];
    if (d.lib === 'gear') return [-16.5, -16.5, 0, 16.5, 16.5, 6];

    const hole = spec.part ? spec.part.role === 'hole' : false;
    const col = new THREE.Color(hole ? Viewer.theme.hole : Viewer.theme.accent);
    const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.22, depthWrite: false }));
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.95 }));
    const obj = new THREE.Group(); obj.add(mesh, edges); obj.matrixAutoUpdate = false; obj.renderOrder = 8;
    Viewer.groups.overlay.add(obj);

  }
  function bindTile(el, spec) {
    el.addEventListener('pointerdown', (e) => {

// ================= Messen =================
const Measure = (() => {
  let on = false, pts = [], objs = [], els = [];
  function toggle() { on ? stop() : start(); }
  function start() {
    if (Sketch.active) return;
    on = true; pts = []; clearVis();
    App.clearSelection(); Handles.clear();
    $('#t-measure') && $('#t-measure').classList.add('active');
    UI.hint('<b>Messen:</b> Klick zwei Punkte an – oder eine runde Kante für den Durchmesser. <b>Esc</b> beendet.');
    Viewer.canvas.style.cursor = 'crosshair';
  }
  function stop() {
    on = false; pts = []; clearVis();
    $('#t-measure') && $('#t-measure').classList.remove('active');
    UI.hint(null); Viewer.canvas.style.cursor = '';
    Handles.rebuild();
  }
  function clearVis() { for (const o of objs) { Viewer.groups.overlay.remove(o); Viewer.disposeFat(o); } objs = []; for (const e of els) e.remove(); els = []; Viewer.requestRender(); }
  function snapPoint(hit, cx, cy) {
    const n = hit.node; const M = n.obj.matrixWorld;
    if (hit.edgeIdx != null) {
      const g = n.data.edges[hit.edgeIdx];
      if (g) {
        const cand = [g.a, g.b, g.m]; if (g.c) cand.push(g.c);
        let best = null, bd = 12;
        const r = Viewer.canvas.getBoundingClientRect();
        for (const p of cand) { const w = new THREE.Vector3(...p).applyMatrix4(M); const s = Viewer.toScreen(w); const d = Math.hypot(s.x - (cx - r.left), s.y - (cy - r.top)); if (d < bd) { bd = d; best = w; } }
        if (best) return { p: best, edge: g };
        return { p: hit.point.clone(), edge: g };
      }
    }
    return { p: hit.point.clone() };
  }
  function onDown(e) {
    if (!on || e.button !== 0) return false;
    const hit = Viewer.pick(e.clientX, e.clientY, { edgePx: 11 });
    if (!hit) return true;
    const sp = snapPoint(hit, e.clientX, e.clientY);
    if (pts.length === 0 && sp.edge && sp.edge.t === 'CIRCLE' && sp.edge.r && hit.edgeIdx != null) {
      clearVis();
      const W = hit.node.obj.matrixWorld;
      const c = new THREE.Vector3(...sp.edge.c).applyMatrix4(W);
      showLabel(`Ø ${fmt(sp.edge.r * 2, 2)} mm   (R ${fmt(sp.edge.r, 2)})`, c);
      const pos = Viewer.makeFat(hit.node.data.lines.slice(hit.node.data.edgeGroups.find((g) => g[2] === hit.edgeIdx)[0] * 3, (hit.node.data.edgeGroups.find((g) => g[2] === hit.edgeIdx)[0] + hit.node.data.edgeGroups.find((g) => g[2] === hit.edgeIdx)[1]) * 3), Viewer.theme.accent, 4, { depthTest: false });
      pos.matrixAutoUpdate = false; pos.matrix.copy(W); Viewer.groups.overlay.add(pos); objs.push(pos);
      return true;
    }
    if (pts.length >= 2) { pts = []; clearVis(); }
    pts.push(sp.p);
    const dot = Viewer.makeFat([sp.p.x, sp.p.y, sp.p.z, sp.p.x, sp.p.y, sp.p.z + 0.001], Viewer.theme.accent, 10, { depthTest: false }); Viewer.groups.overlay.add(dot); objs.push(dot);
    if (pts.length === 2) {
      const [a, b] = pts; const d = a.distanceTo(b);
      const l = Viewer.makeFat([a.x, a.y, a.z, b.x, b.y, b.z], Viewer.theme.accent, 3, { depthTest: false, dashed: true, dashSize: 2, gapSize: 1.2 }); Viewer.groups.overlay.add(l); objs.push(l);
      showLabel(`${fmt(d, 2)} mm   ΔX ${fmt(Math.abs(b.x - a.x), 2)}  ΔY ${fmt(Math.abs(b.y - a.y), 2)}  ΔZ ${fmt(Math.abs(b.z - a.z), 2)}`, a.clone().lerp(b, 0.5));
    }
    Viewer.requestRender();
    return true;
  }
  let lastLabel = null;
  function showLabel(text, p) {
    const el = h('div', { class: 'dimlabel live', style: { fontSize: '13px', padding: '5px 8px' } }, text); $('#overlay').append(el); els.push(el);
    lastLabel = { el, p }; place();
  }
  function place() { for (const e of els) { if (!lastLabel) continue; const s = Viewer.toScreen(lastLabel.p); lastLabel.el.style.left = s.x + 'px'; lastLabel.el.style.top = s.y - 22 + 'px'; } }
  function init() {
    let d0 = null;
    Viewer.canvas.addEventListener('pointerdown', (e) => { if (on) d0 = { x: e.clientX, y: e.clientY }; }, true);
    Viewer.canvas.addEventListener('pointerup', (e) => { if (on && d0 && Math.hypot(e.clientX - d0.x, e.clientY - d0.y) < 5) onDown(e); d0 = null; });
    Viewer.on('camera', place);
  }
  return { init, toggle, start, stop, get active() { return on; } };
})();

// ================= KI-Helfer (baut und ändert Modelle aus einer Beschreibung) =================
const AI = (() => {
  let panel = null, ctl = null, history = [], off = false;
  const RULES = `Du bist der CAD-Helfer in der Web-App „Tracery“. Du baust präzise technische 3D-Modelle, vor allem für FPV-/Speed-Drohnen, aus Grundkörpern, Skizzen und Bauteilen. Einheiten: Millimeter. Z zeigt nach oben, die XY-Ebene bei z=0 ist die Grundebene.

Antworte NUR mit einem JSON-Objekt:
{"antwort": "kurze Antwort auf Deutsch, 1–3 Sätze, per du", "aktionen": [ ... ]}

Aktionen:
{"op":"hinzufuegen","objekt":OBJEKT,"in":"<id einer Gruppe, optional>"}
{"op":"aendern","id":"<id>","setze":{"name":"…","rolle":"koerper"|"loch","p":{…},"t":{…},"farbe":"#RRGGBB"}}
{"op":"loeschen","id":"<id>"}
{"op":"gruppieren","ids":["<id>","<id>"],"name":"…"}
{"op":"mass","name":"Breite","wert":"75"}   (legt ein benanntes Maß an oder ändert es)
{"op":"rundung","id":"<id>","typ":"fillet"|"chamfer","r":2,"kanten":"all"|"top"|"bottom"|"vertical"|"horizontal"}

OBJEKT:
{"art":"box|cylinder|tube|sphere|hemisphere|cone|pyramid|torus|prism|wedge|extrude|part|group","name":"…","rolle":"koerper"|"loch","p":{…},"t":{"x":0,"y":0,"z":0,"rx":0,"ry":0,"rz":0},"farbe":"#RRGGBB","kinder":[OBJEKT…],"rundungen":[{"typ":"fillet","r":2,"kanten":"vertical"}]}

Parameter p (alle Grundkörper stehen mit der Unterseite auf z=0 ihres eigenen Systems und sind in X/Y zentriert; t verschiebt/dreht, Drehung in Grad um X, dann Y, dann Z):
- box: w (Breite X), d (Tiefe Y), h (Höhe Z)
- cylinder: d, h · tube: d (außen), wall, h · sphere: d · hemisphere: d · cone: d1 (unten), d2 (oben, 0 = Spitze), h
- pyramid: w, d, h · torus: d (außen), t (Ringdicke) · prism: n (Ecken), d (Umkreis), h · wedge: w, d, h (die Schräge fällt zur +X-Seite ab)
- extrude: {"ebene":"XY"|"XZ"|"YZ","versatz":0,"hoehe":10,"richtung":"normal"|"reverse"|"both","form":[ELEMENT…]}
  ELEMENT (2D in mm): {"rect":[x1,y1,x2,y2]} · {"circle":[cx,cy,r]} · {"poly":[[x,y],[x,y],…]} (geschlossener Linienzug) · {"slot":[x1,y1,x2,y2,r]}
  Ebene XY: u=X, v=Y, hoch in +Z. Ebene XZ: u=X, v=Z, hoch in −Y. Ebene YZ: u=Y, v=Z, hoch in +X. „versatz“ verschiebt die Ebene entlang dieser Richtung. Formen, die ganz in einer anderen liegen, werden zu Löchern darin.
- part (Bauteile, Öffnung zeigt nach +Z, Tiefe geht nach −Z; setze z auf die Oberfläche):
  {"lib":"screwHole","size":"M2|M2.5|M3|M4|M5|M6|M8","head":"countersunk|counterbore|none","length":10} (rolle loch)
  {"lib":"nutTrap","size":"M3","length":12} (loch) · {"lib":"insert","size":"M3"} (loch, Gewindeeinsatz) · {"lib":"slotHole","len":20,"w":4.5,"depth":10} (loch)
  {"lib":"snapHook","length":12,"w":8,"t":1.6,"hook":1.2} (koerper) · {"lib":"hinge","len":40,"w":15,"t":2.4,"gap":0.4} (koerper) · {"lib":"gear","teeth":20,"module":1.5,"h":6,"bore":5} (koerper)
- group: {"kinder":[…]} – Kinder mit rolle "loch" werden aus den Kindern mit rolle "koerper" geschnitten. t der Kinder ist relativ zur Gruppe.

Regeln:
- Löcher auf oberster Ebene schneiden automatisch alle Körper, die sie berühren. Ein Teil mit Löchern baust du am saubersten als group.
- Löcher sollen 0,5 mm über die Oberfläche hinausragen, damit sie sauber schneiden.
- Lege Teile auf z=0, sofern nichts anderes gewünscht ist. Maße exakt übernehmen, nicht runden. Für Schrauben nimm part screwHole.
- Zahlenwerte dürfen Formeln mit Maß-Namen sein, z. B. "Breite/2+3". Lege bei neuen Teilen für die 2–4 wichtigsten Größen Maße an (op "mass") und nutze sie.
- Neue Teile nicht in bestehende hineinsetzen: stelle sie daneben, außer der Wunsch ist ausdrücklich eine Änderung am Bestehenden.
- Bei einer reinen Frage: "aktionen": [].
- Beziehe dich mit "id" nur auf ids, die im aktuellen Modell stehen. „das“, „es“, „hier“ meint die Auswahl.

Beispiel – Wunsch „Platte 60 × 40 × 4 mit einem Loch in der Mitte“:

      if (report.added.length) setTimeout(() => Viewer.fit(), 500);
    }
  }
  // ---------- Umsetzen ----------
  function num(v, d) {
    if (typeof v === 'number' && isFinite(v)) return Math.max(-5000, Math.min(5000, v));
    if (typeof v === 'string' && v.trim()) { const n = parseNum(v); if (!isNaN(n)) return n; return v.trim().slice(0, 80); }
    return d;
  }
  function cleanP(kind, p) {
    const out = {};
    for (const k in p || {}) { if (typeof p[k] === 'object') continue; out[k] = typeof p[k] === 'string' && ['lib', 'size', 'head'].includes(k) ? p[k] : num(p[k], undefined); if (out[k] === undefined) delete out[k]; }
    return out;
  }
  function cleanT(t) { const o = {}; for (const k of ['x', 'y', 'z', 'rx', 'ry', 'rz']) if (t && t[k] != null) o[k] = num(t[k], 0); return o; }
  const PLANEDEF = { XY: { x: [1, 0, 0], n: [0, 0, 1] }, XZ: { x: [1, 0, 0], n: [0, -1, 0] }, YZ: { x: [0, 1, 0], n: [1, 0, 0] } };
  function buildItem(o, notes) {
    const kind = String(o.art || o.kind || '').toLowerCase();
    if (!KMAP[kind]) { notes.push(`„${o.art}“ kenne ich nicht.`); return null; }
    const role = o.rolle === 'loch' || o.role === 'hole' ? 'hole' : 'solid';
    let it;
    if (kind === 'extrude') {
      const pl = PLANEDEF[String(o.p && o.p.ebene || 'XY').toUpperCase()] || PLANEDEF.XY;
      const off = num(o.p && o.p.versatz, 0);
      const plane = { o: pl.n.map((v) => v * (typeof off === 'number' ? off : 0)), x: pl.x, n: pl.n };
      const ents = [];
      for (const el of (o.p && o.p.form) || []) {
        if (el.rect && el.rect.length === 4) ents.push({ id: uid('e'), type: 'rect', a: [num(el.rect[0], 0), num(el.rect[1], 0)], b: [num(el.rect[2], 10), num(el.rect[3], 10)] });
        else if (el.circle && el.circle.length === 3) ents.push({ id: uid('e'), type: 'circle', c: [num(el.circle[0], 0), num(el.circle[1], 0)], r: Math.abs(num(el.circle[2], 5)) });
        else if (el.slot && el.slot.length === 5) ents.push({ id: uid('e'), type: 'slot', a: [num(el.slot[0], 0), num(el.slot[1], 0)], b: [num(el.slot[2], 10), num(el.slot[3], 0)], r: Math.abs(num(el.slot[4], 2)) });
        else if (Array.isArray(el.poly) && el.poly.length >= 3) { const pts = el.poly.map((q) => [num(q[0], 0), num(q[1], 0)]); for (let i = 0; i < pts.length; i++) ents.push({ id: uid('e'), type: 'line', a: pts[i], b: pts[(i + 1) % pts.length] }); }
      }
      if (!ents.length) { notes.push('Eine Skizze war leer.'); return null; }
      it = Model.newItem('extrude', {}, { name: o.name || 'Skizzenkörper', role });
      it.p = { sketch: { plane, ents }, dist: num(o.p.hoehe ?? o.p.dist, 10), dir: ['normal', 'reverse', 'both'].includes(o.p.richtung) ? o.p.richtung : 'normal' };
    } else if (kind === 'part') {
      const lib = o.p && o.p.lib; const def = LIBMAP[lib];
      if (!def) { notes.push(`Das Bauteil „${lib}“ gibt es nicht.`); return null; }
      it = Model.newItem('part', { ...libDefaults(def), ...cleanP('part', o.p) }, { name: o.name || def.label, role: def.role });
    } else if (kind === 'group') {
      it = Model.newItem('group', {}, { name: o.name || 'Gruppe', role });
      for (const c of o.kinder || o.children || []) { const ci = buildItem(c, notes); if (ci) it.children.push(ci); }
      if (!it.children.length) return null;
      it.color = (it.children.find((c) => c.role !== 'hole') || it.children[0]).color;
    } else {
      it = Model.newItem(kind, cleanP(kind, o.p), { name: o.name || KINDS[kind].label, role });
    }
    Object.assign(it.t, cleanT(o.t));
    if (o.farbe && /^#[0-9a-f]{6}$/i.test(o.farbe)) it.color = o.farbe;
    for (const r of o.rundungen || []) if (r && (r.r || r.r === 0)) it.finishes.push({ id: uid('f'), type: r.typ === 'chamfer' ? 'chamfer' : 'fillet', r: num(r.r, 1), edges: ['all', 'top', 'bottom', 'vertical', 'horizontal'].includes(r.kanten) ? r.kanten : 'all' });
    return it;
  }
  function applyActions(acts, text) {
    const report = { added: [], changed: [], notes: [] };
    App.change('KI: ' + text.slice(0, 40), (doc) => {
      for (const a of acts.slice(0, 60)) {
        const op = String(a.op || '').toLowerCase();
        if (op === 'mass') {
          const name = String(a.name || '').trim().replace(/\s+/g, '_');
          if (!/^[A-Za-zÄÖÜäöüß_][A-Za-zÄÖÜäöüß_0-9]*$/.test(name)) continue;
          const ex = doc.params.find((p) => p.name.toLowerCase() === name.toLowerCase());
          const val = num(a.wert ?? a.value, 10);
          if (ex) ex.expr = val; else doc.params.push({ id: uid('m'), name, expr: val });
        } else if (op === 'hinzufuegen' || op === 'add') {
          const it = buildItem(a.objekt || a.object || {}, report.notes); if (!it) continue;
          const tgt = a.in ? Model.find(doc, a.in) : null;
          if (tgt && tgt.item.kind === 'group') tgt.item.children.push(it); else doc.items.push(it);
          report.added.push(it.id);
        } else if (op === 'aendern' || op === 'change') {
          const f = Model.find(doc, a.id); if (!f) { report.notes.push('Ein Objekt zum Ändern gab es nicht.'); continue; }
          const s = a.setze || a.set || {};
          if (s.name) f.item.name = String(s.name).slice(0, 60);
          if (s.rolle) f.item.role = s.rolle === 'loch' ? 'hole' : 'solid';
          if (s.p && typeof s.p === 'object') {
            if (f.item.kind === 'extrude') { if (s.p.hoehe != null) f.item.p.dist = num(s.p.hoehe, f.item.p.dist); if (s.p.richtung) f.item.p.dir = s.p.richtung; }
            else Object.assign(f.item.p, cleanP(f.item.kind, s.p));
          }
          if (s.t) Object.assign(f.item.t, cleanT(s.t));
          if (s.farbe && /^#[0-9a-f]{6}$/i.test(s.farbe)) f.item.color = s.farbe;
          report.changed.push(f.item.id);
        } else if (op === 'loeschen' || op === 'delete') {
          const f = Model.find(doc, a.id); if (f) { f.list.splice(f.list.indexOf(f.item), 1); report.changed.push(a.id); }
        } else if (op === 'gruppieren' || op === 'group') {
          const ids = (a.ids || []).filter((id) => doc.items.find((x) => x.id === id));
          if (ids.length < 2) continue;
          const G = Model.newItem('group', {}, { name: a.name || 'Gruppe' });
          const at = Math.min(...ids.map((id) => doc.items.findIndex((x) => x.id === id)));
          for (const id of ids) { const i = doc.items.findIndex((x) => x.id === id); G.children.push(doc.items.splice(i, 1)[0]); }
          G.color = (G.children.find((c) => c.role !== 'hole') || G.children[0]).color;
          doc.items.splice(at, 0, G); report.added.push(G.id);
        } else if (op === 'rundung' || op === 'fillet') {
          const f = Model.find(doc, a.id); if (!f) continue;
          f.item.finishes = f.item.finishes || [];
          f.item.finishes.push({ id: uid('f'), type: a.typ === 'chamfer' ? 'chamfer' : 'fillet', r: num(a.r, 1), edges: ['all', 'top', 'bottom', 'vertical', 'horizontal'].includes(a.kanten) ? a.kanten : 'all' });
          report.changed.push(f.item.id);
        }
      }
      if (!report.added.length && !report.changed.length && !acts.some((a) => a.op === 'mass')) return false;
    });
    const sel = report.added.length ? report.added : report.changed.filter((id) => Model.find(App.doc, id));
    if (sel.length) App.select(sel.slice(0, 20));
    return report;
  }
  return { ask, get available() { return !off; } };
})();

    inner.append(h('div', { class: 'start-foot', html: 'Projekte werden automatisch in diesem Browser gesichert. Zum sicheren Aufbewahren und Teilen: <b>Projekt als Datei speichern</b>.<br>Tracery rechnet mit OpenCascade (LGPL-2.1) über replicad (MIT) und zeigt 3D mit three.js (MIT).' }));
    el.append(inner);
    const close = h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Schließen', style: { position: 'fixed', top: '12px', right: '12px' } }); close.innerHTML = icon('close'); close.onclick = hide;
    if (App.doc.items.length) el.append(close);
    document.body.append(el);
    const onKey = (e) => { if (e.key === 'Escape' && el && App.doc.items.length) hide(); };
    document.addEventListener('keydown', onKey, { once: true });
  }
  function hide() { if (el) { el.remove(); el = null; } }
  function newProject(silent) {
    App.setDoc(Model.newDoc('Neues Projekt'));
    hide();
    if (!silent) UI.toast('Neues Projekt. Fang mit einem Körper an – oder beschreib unten, was du bauen willst.', { icon: 'newfile', ms: 4500 });
  }
  async function openBlob(f) {
    try {
      const txt = await f.text(); const doc = JSON.parse(txt);
      Model.migrate(doc);
      if (App.loadStored(doc.id) && doc.id !== App.doc.id) doc.id = uid('p');
      App.setDoc(doc); hide();
      App.fileSavedRev = App.revision;
      UI.toast(`„${doc.name}“ geöffnet.`, { icon: 'folder' });
    } catch (e) { const E = ERRORS.importFailed; UI.toast(`${E.titel}. ${E.erklaerung} ${E.loesung}`, { kind: 'bad', ms: 7000 }); console.warn(e); }
  }
  function openFile() {
    const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) openBlob(f); };
    document.body.append(inp); inp.click();
  }
  // Projektdatei einfach ins Fenster ziehen
  addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  addEventListener('drop', (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f || !/\.json$/i.test(f.name)) return;
    e.preventDefault(); openBlob(f);
  });
  async function saveFile() {
    const name = Print.safeName(App.doc.name);
    const ok = await Print.save(name + '.tracery.json', JSON.stringify(App.doc, null, 1));
    if (ok) App.fileSavedRev = App.revision;
  }
  return { show, hide, newProject, openFile, openBlob, saveFile, get open() { return !!el; } };
})();

// ---------- Einführung ----------
const Tour = (() => {
  let box = null, ring = null, idx = 0, off = [];
  const STEPS = [
    { title: 'Willkommen bei Tracery', text: 'In drei Minuten baust du ein Teil mit Loch und exportierst es. Links siehst du den Verlauf, rechts die Einstellungen, in der Mitte dein Modell.', target: null },
    { title: 'Leg einen Quader hin', text: 'Klick oben auf „Körper“ und dann auf „Quader“. Du kannst ihn auch direkt auf die Fläche ziehen.', target: '#t-body', until: () => App.doc.items.some((x) => x.kind === 'box') },
    { title: 'Mach ihn größer', text: 'Zieh an einem weißen Anfasser – oder klick auf eine der Zahlen am Quader und tipp zum Beispiel 40 ein.', target: '#viewport', until: (ev) => ev === 'size' },
    { title: 'Ein Loch einbauen', text: 'Klick wieder auf „Körper“ und unten auf „Zylinder als Loch“ – schon geht ein Loch durch den Quader. Jeder Körper kann übrigens mit einem Klick rechts auf „Loch“ zum Loch werden.', target: '#t-body', until: () => App.doc.items.some((x) => x.role === 'hole') || App.doc.items.some((x) => x.kind === 'group') },
    { title: 'Prüfen und speichern', text: 'Unten rechts siehst du Größe und Status des Modells. Mit „Exportieren“ bekommst du STEP, STL oder 3MF. Viel Spaß beim Bauen!', target: '#t-export', last: true },
  ];
  let timer = null;
  function start() { stop(); idx = 0; show(); off.push(App.on('history', check), App.on('doc', check)); timer = setInterval(place, 350); }
  function stop() { if (box) box.remove(); if (ring) ring.remove(); box = ring = null; off.forEach((f) => f()); off = []; clearInterval(timer); timer = null; }
  function check() {
    const s = STEPS[idx]; if (!s || !s.until) return;
    const last = App.undoStack[App.undoStack.length - 1];
    const ev = last && /Größe|Maß/.test(last.label) ? 'size' : null;
    if (s.until(ev)) setTimeout(() => { if (STEPS[idx] === s) { idx++; show(); } }, 500);
  }
  function show() {
    if (box) box.remove(); if (ring) ring.remove(); box = ring = null;
    const s = STEPS[idx]; if (!s) { stop(); return; }
    box = h('div', { class: 'tour', role: 'dialog', 'aria-label': 'Einführung' });
    box.append(h('div', { class: 'step' }, `Schritt ${idx + 1} von ${STEPS.length}`), h('h3', null, s.title), h('p', null, s.text));
    const row = h('div', { class: 'btn-row', style: { justifyContent: 'space-between' } });
    const skip = h('button', { type: 'button', class: 'btn ghost small' }, s.last ? 'Schließen' : 'Einführung beenden'); skip.onclick = stop;
    const next = h('button', { type: 'button', class: 'btn primary small' }, s.last ? 'Los geht’s' : 'Weiter'); next.onclick = () => { idx++; show(); };
    row.append(skip, next); box.append(row);
    document.body.append(box);
    if (s.target && $(s.target)) { ring = h('div', { class: 'tour-ring' }); document.body.append(ring); }
    place();
  }
  // Lage von Hinweis und Ring – läuft regelmäßig, damit der Hinweis offenen Menüs ausweicht
  function place() {
    if (!box) return;
    const s = STEPS[idx]; const t = s && s.target && $(s.target);
    const bw = box.offsetWidth, bh = box.offsetHeight;
    let x, y;
    if (t && ring) {
      const r = t.getBoundingClientRect();
      const big = r.width > 400;
      Object.assign(ring.style, big ? { left: r.left + 12 + 'px', top: r.top + 12 + 'px', width: r.width - 24 + 'px', height: r.height - 24 + 'px' } : { left: r.left - 4 + 'px', top: r.top - 4 + 'px', width: r.width + 8 + 'px', height: r.height + 8 + 'px' });
      x = big ? r.left + 24 : r.left; y = big ? r.bottom - bh - 24 : r.bottom + 14;
    } else { x = (innerWidth - bw) / 2; y = innerHeight * 0.3; }
    const fit = (v, max) => clamp(v, 12, max - 12);
    x = fit(x, innerWidth - bw); y = fit(y, innerHeight - bh);
    const obst = $$('.flyout, .menu, .pop, .modal').map((e) => e.getBoundingClientRect());
    const hits = (px, py) => obst.some((q) => px < q.right + 8 && px + bw > q.left - 8 && py < q.bottom + 8 && py + bh > q.top - 8);
    if (hits(x, y)) {
      const c = $('#center').getBoundingClientRect();
      const cands = [[c.right - bw - 16, c.bottom - bh - 16], [c.left + 16, c.bottom - bh - 16], [c.right - bw - 16, c.top + 16]];
      for (const [cx, cy] of cands) { const X = fit(cx, innerWidth - bw), Y = fit(cy, innerHeight - bh); if (!hits(X, Y)) { x = X; y = Y; break; } }
    }
    box.style.left = Math.round(x) + 'px'; box.style.top = Math.round(y) + 'px';
  }
  return { start, stop };
})();
