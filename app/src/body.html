<div id="app">
  <nav class="tabbar" id="proj-tabs" aria-label="Geöffnete Projekte" data-i18n-aria="tabs.barAria">
    <div class="tabbar-list" id="proj-tabs-list" role="tablist"></div>
    <button class="tabbar-add" id="proj-tab-add" type="button" aria-label="Neuer Tab" data-tip="Projekt in neuem Tab öffnen" data-help="projectTabs" data-i18n-aria="tabs.addAria" data-i18n-tip="tabs.addTip"></button>
  </nav>
  <header class="topbar">
    <button class="icon-btn panel-toggle" id="btn-left" type="button" aria-label="Verlauf zeigen" data-tip="Verlauf" data-help="tabletPanels" aria-expanded="false" data-i18n-aria="topbar.showTree" data-i18n-tip="topbar.tree"></button>
    <a class="brand" href="#" id="brand" aria-label="Tracery – Startseite" data-i18n-aria="topbar.brandAria">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.885) translate(-12 -10.2)" stroke-width="1.92"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7" /><path d="M12 22V12" /><path d="M12 12L21 7" /><path d="M12 12L3 7" /><path d="M3 7A9 9 0 0 1 21 7" /><path d="M21 7A9 9 0 0 1 12 22" /><path d="M12 22A9 9 0 0 1 3 7" /></g></svg>
      <b>Tracery</b>
    </a>
    <div class="seg pro" role="group" aria-label="Arbeitsbereich" data-i18n-aria="topbar.workspace">
      <button type="button" id="tab-model" aria-pressed="true" data-i18n="topbar.model">Modell</button>
      <button type="button" id="tab-drawing" aria-pressed="false" data-i18n="topbar.drawing">Zeichnung</button>
    </div>
    <div class="tools" id="tools"></div>
    <div class="right-tools">
      <button class="level-btn" id="btn-level" type="button" data-help="levelSwitch" aria-pressed="false">Profi</button>
      <button class="icon-btn" id="btn-undo" type="button" aria-label="Rückgängig" data-tip="Rückgängig" data-kbd="Strg Z" data-i18n-aria="topbar.undo" data-i18n-tip="topbar.undo"></button>
      <button class="icon-btn" id="btn-redo" type="button" aria-label="Wiederholen" data-tip="Wiederholen" data-kbd="Strg Y" data-i18n-aria="topbar.redo" data-i18n-tip="topbar.redo"></button>
      <button class="proj-name" id="btn-project" type="button" data-tip="Projekt" data-i18n-tip="topbar.project">Neues Projekt</button>
      <button class="folder-badge" id="btn-folder-status" type="button" data-help="saveFolder" hidden></button>
      <button class="icon-btn whatis-btn" id="btn-whatis" type="button" aria-label="Was ist das?" aria-pressed="false" data-tip="Was ist das? – Klick erklärt jedes Element" data-help="whatIsThis" data-i18n-aria="whatis.btnAria" data-i18n-tip="whatis.btnTip"></button>
      <button class="icon-btn" id="btn-workspace" type="button" aria-label="Arbeitsflächen-Anordnung" data-tip="Arbeitsfläche & Panels" data-help="workspaceLayout" data-i18n-aria="ws.btnAria" data-i18n-tip="ws.btnTip"></button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Menü" data-tip="Menü" data-i18n-aria="topbar.menu" data-i18n-tip="topbar.menu"></button>
      <button class="icon-btn panel-toggle" id="btn-right" type="button" aria-label="Eigenschaften zeigen" data-tip="Eigenschaften" data-help="tabletPanels" aria-expanded="false" data-i18n-aria="topbar.showProps" data-i18n-tip="topbar.props"></button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <aside class="left" id="left" aria-label="Verlauf" data-i18n-aria="topbar.tree">
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="lt-tree" aria-selected="true" data-i18n="topbar.tree">Verlauf</button>
          <button type="button" role="tab" id="lt-params" aria-selected="false" data-i18n="topbar.params">Maße</button>
          <button type="button" role="tab" id="lt-log" class="pro" aria-selected="false" data-i18n="topbar.log">Protokoll</button>
        </div>
        <button class="icon-btn panel-close" id="btn-left-close" type="button" aria-label="Leiste einklappen" data-tip="Leiste einklappen" data-i18n-aria="topbar.closePanel" data-i18n-tip="topbar.closePanel"></button>
      </div>
      <div class="panel-body" id="left-body"></div>
    </aside>

    <section class="center" id="center">
      <div id="viewport"></div>
      <div id="sheet" hidden></div>
      <div class="overlay-layer" id="overlay"></div>
    </section>

    <aside class="right" id="right" aria-label="Eigenschaften" data-i18n-aria="topbar.props">
      <div class="panel-head"><span class="panel-title" id="right-title" data-i18n="topbar.props">Eigenschaften</span><button class="icon-btn panel-close" id="btn-right-close" type="button" aria-label="Leiste einklappen" data-tip="Leiste einklappen" data-i18n-aria="topbar.closePanel" data-i18n-tip="topbar.closePanel"></button></div>
      <div class="panel-body" id="right-body"></div>
    </aside>
  </main>

  <footer class="bottombar">
    <div class="hintline" id="hintline"></div>
    <div class="cmd" id="cmd">
      <div class="cmd-box">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.9 5.2 5.2 1.9-5.2 1.9L12 16.7l-1.9-5.2-5.2-1.9 5.2-1.9zM19 14l.9 2.4 2.4.9-2.4.9L19 20.6l-.9-2.4-2.4-.9 2.4-.9z" fill="currentColor"/></svg>
        <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="Werkzeug suchen oder beschreiben, was du bauen willst …" aria-label="Werkzeug suchen oder der KI beschreiben" data-i18n-placeholder="topbar.cmdPlaceholder" data-i18n-aria="topbar.cmdAria">
        <button class="go" id="cmd-go" type="button" aria-label="Ausführen" data-i18n-aria="topbar.cmdGo" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="ampel-wrap"><span class="coords" id="coords" data-help="coords" aria-live="off"></span><button class="st-chip st-sel" id="status-sel" type="button" data-help="statusSel" hidden></button><button class="st-chip st-unit" id="status-unit" type="button" data-help="statusUnit" aria-label="Einheit ändern" data-i18n-aria="status.changeUnit">mm</button><span class="st-chip st-calc busy" id="status-calc" data-help="statusCalc" data-state="loading" aria-live="polite"><i class="st-dot"></i><span class="t" data-i18n="status.loading">Lädt …</span></span><button class="st-chip st-cancel" id="status-cancel" type="button" data-help="calcCancel" hidden></button><button class="ampel" id="ampel" type="button"><i class="dot"></i><span class="t" data-i18n="status.loadingLong">Wird geladen …</span></button><button class="st-chip st-bell" id="status-bell" type="button" data-help="noticeCenter" aria-label="Meldungs-Zentrale" aria-expanded="false" data-i18n-aria="notices.bellAria"></button></div>
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
