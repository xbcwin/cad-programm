<div id="app">
  <header class="topbar">
    <button class="icon-btn panel-toggle" id="btn-left" type="button" aria-label="Verlauf zeigen" data-tip="Verlauf"></button>
    <a class="brand" href="#" id="brand" aria-label="Tracery – Startseite">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(12 12) scale(.885) translate(-12 -10.2)" stroke-width="1.92"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7" /><path d="M12 22V12" /><path d="M12 12L21 7" /><path d="M12 12L3 7" /><path d="M3 7A9 9 0 0 1 21 7" /><path d="M21 7A9 9 0 0 1 12 22" /><path d="M12 22A9 9 0 0 1 3 7" /></g></svg>
      <b>Tracery</b>
    </a>
    <div class="seg pro" role="group" aria-label="Arbeitsbereich">
      <button type="button" id="tab-model" aria-pressed="true">Modell</button>
      <button type="button" id="tab-drawing" aria-pressed="false">Zeichnung</button>
    </div>
    <div class="tools" id="tools"></div>
    <div class="right-tools">
      <button class="level-btn" id="btn-level" type="button" data-help="levelSwitch" aria-pressed="false">Profi</button>
      <button class="icon-btn" id="btn-undo" type="button" aria-label="Rückgängig" data-tip="Rückgängig" data-kbd="Strg Z"></button>
      <button class="icon-btn" id="btn-redo" type="button" aria-label="Wiederholen" data-tip="Wiederholen" data-kbd="Strg Y"></button>
      <button class="proj-name" id="btn-project" type="button" data-tip="Projekt">Neues Projekt</button>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Menü" data-tip="Menü"></button>
      <button class="icon-btn panel-toggle" id="btn-right" type="button" aria-label="Eigenschaften zeigen" data-tip="Eigenschaften"></button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <aside class="left" id="left" aria-label="Verlauf">
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="lt-tree" aria-selected="true">Verlauf</button>
          <button type="button" role="tab" id="lt-params" aria-selected="false">Maße</button>
          <button type="button" role="tab" id="lt-log" class="pro" aria-selected="false">Protokoll</button>
        </div>
      </div>
      <div class="panel-body" id="left-body"></div>
    </aside>

    <section class="center" id="center">
      <div id="viewport"></div>
      <div id="sheet" hidden></div>
      <div class="overlay-layer" id="overlay"></div>
    </section>

    <aside class="right" id="right" aria-label="Eigenschaften">
      <div class="panel-head"><span class="panel-title" id="right-title">Eigenschaften</span></div>
      <div class="panel-body" id="right-body"></div>
    </aside>
  </main>

  <footer class="bottombar">
    <div class="hintline" id="hintline"></div>
    <div class="cmd" id="cmd">
      <div class="cmd-box">
        <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.9 5.2 5.2 1.9-5.2 1.9L12 16.7l-1.9-5.2-5.2-1.9 5.2-1.9zM19 14l.9 2.4 2.4.9-2.4.9L19 20.6l-.9-2.4-2.4-.9 2.4-.9z" fill="currentColor"/></svg>
        <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="Werkzeug suchen oder beschreiben, was du bauen willst …" aria-label="Werkzeug suchen oder der KI beschreiben">
        <button class="go" id="cmd-go" type="button" aria-label="Ausführen" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="ampel-wrap"><span class="coords" id="coords" data-help="coords" aria-live="off"></span><button class="ampel" id="ampel" type="button"><i class="dot"></i><span class="t">Wird geladen …</span></button></div>
  </footer>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
